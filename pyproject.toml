[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizeit"
version = "1.0.0"
description = "Unified >=15 FPS Video & Interactive Surface Design Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3.0",
    "opencv-python-headless>=4.10.0.84",
    "scipy>=1.14.0",
    "Pillow>=11.0.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
visualizeit = "visualizeit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visualizeit*"]

[tool.setuptools.package-data]
visualizeit = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest_cache"
addopts = [
    "--basetemp=.cache/tmp/pytest",
]
